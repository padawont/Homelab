[project]
name = "homelab-agent-eval"
version = "0.0.0"
description = "Conformance harness for the Homelab PKM agent roster (epic #68, issue #69)"
requires-python = ">=3.11"
dependencies = ["pydantic-evals[logfire]>=2.58"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "live: invokes a real agent through `opencode run` (needs provider auth; costs money)",
]
