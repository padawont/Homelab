# config.yaml — cv-sender worker configuration (source of truth).
# This file is wrapped by configmap.yaml (ConfigMap "cv-sender-config") and mounted
# into the pod at /app/config/config.yaml.
# SAFETY: dry_run MUST remain true until a pilot run has been verified end to end.
dry_run: true
pilot_count: 3
source:
  url: "https://ledelsesinformation.aarhuskommune.dk/#vfs://global/AARHUS-I-TAL/UDDANNELSE_I_TAL-Erhvervspraktik-Virksomhedsliste.xview"
account:
  email: "cvsenderworkonly@gmail.com"
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  imap_host: "imap.gmail.com"
  # Deliberately tracked (not in the Secret): the routing target for
  # replies, bounces and digests; carries no credential.
  notify_email: "RyanHarrisZubair@gmail.com"
filters:
  branche_query: "computer"
  postdistrikter: ["Viby J", "Aarhus N", "Aarhus C", "Aarhus V"]
enrichment:
  aarhus_url: "https://selskabsinfo.dk/virksomheder-i/aarhus"
  skip_if_no_email: true
rate:
  daily_cap: 400
  delay_seconds: 20
  poll_seconds: 300
email:
  attachment: "/app/config/cv/cv.pdf"
state:
  db_path: "/app/data/state.db"
paths:
  data_dir: "/app/data"
  preview_csv: "/app/data/preview.csv"
