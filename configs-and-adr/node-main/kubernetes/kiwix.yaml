# ref: .research/kiwix-research.md — Issue scope: kiwix offline server deployment
---
apiVersion: v1
kind: Namespace
metadata:
  name: kiwix

# ref: knowledge/kubernetes/kiwix/kiwix-serve-config.md (lines 81-93) — Storage requirements
# ref: PR criteria #2 — PVC kiwix-data with longhorn storage class
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kiwix-data
  namespace: kiwix
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 200Gi

# ref: knowledge/kubernetes/kiwix/kiwix-serve-config.md (lines 21-52) — Image, args, port
# ref: knowledge/kubernetes/kiwix/kiwix-serve-config.md (lines 86-88) — Health checks
# ref: knowledge/kubernetes/kiwix/kiwix-serve-config.md (lines 81-84) — Resources
# ref: nightly kiwix-serve with libzim 9.8.1 installed at /opt/kiwix-serve on node-1
# ref: library XML generated by kiwix-manage at /opt/kiwix-library.xml on node-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwix
  namespace: kiwix
  labels:
    app: kiwix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kiwix
  template:
    metadata:
      labels:
        app: kiwix
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kiwix
        image: alpine:3.20
        command:
        - /opt/kiwix-serve
        args:
        - --port=8080
        - --library
        - /opt/kiwix-library.xml
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: binary
          mountPath: /opt/kiwix-serve
        - name: libxml
          mountPath: /opt/kiwix-library.xml
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: binary
        hostPath:
          path: /opt/kiwix-serve
          type: File
      - name: libxml
        hostPath:
          path: /opt/kiwix-library.xml
          type: File
      - name: data
        persistentVolumeClaim:
          claimName: kiwix-data

# ref: .research/kiwix-research.md — LoadBalancer IP 192.168.111.101
# ref: PR criteria #5 — LoadBalancer type with static IP
---
apiVersion: v1
kind: Service
metadata:
  name: kiwix
  namespace: kiwix
  labels:
    app: kiwix
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.111.101
  ports:
  - port: 80
    targetPort: 8080
    name: http
  selector:
    app: kiwix
