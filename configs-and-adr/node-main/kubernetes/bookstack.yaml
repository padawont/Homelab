---
apiVersion: v1
kind: Namespace
metadata:
  name: bookstack

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstack-db
  namespace: bookstack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstack-uploads
  namespace: bookstack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: bookstack-db
  namespace: bookstack
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "bookstack_root_pw"
  MYSQL_DATABASE: "bookstack"
  MYSQL_USER: "bookstack"
  MYSQL_PASSWORD: "bookstack_user_pw"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: bookstack
  labels:
    app: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mariadb
        image: mariadb:11
        envFrom:
        - secretRef:
            name: bookstack-db
        env:
        - name: MYSQL_ROOT_HOST
          value: "%"
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: bookstack-db

---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: bookstack
  labels:
    app: mariadb
spec:
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  selector:
    app: mariadb

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstack
  namespace: bookstack
  labels:
    app: bookstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstack
  template:
    metadata:
      labels:
        app: bookstack
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - sh
        - -c
        - until nc -z mariadb 3306; do echo "waiting for mariadb..."; sleep 2; done;
      containers:
      - name: bookstack
        image: lscr.io/linuxserver/bookstack:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        - name: APP_URL
          value: "http://192.168.111.102"
        - name: APP_KEY
          value: "base64:r+TIprTTvq6Hcm6mmxN1NNe0xRHPG7VBq1Vx/jbclXQ="
        - name: DB_HOST
          value: "mariadb"
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: "bookstack"
        - name: DB_USERNAME
          value: "bookstack"
        - name: DB_PASSWORD
          value: "bookstack_user_pw"
        - name: QUEUE_CONNECTION
          value: "database"
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /login
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /login
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: bookstack-uploads

---
apiVersion: v1
kind: Service
metadata:
  name: bookstack
  namespace: bookstack
  labels:
    app: bookstack
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.111.102
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: bookstack
